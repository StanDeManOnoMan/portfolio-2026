<!doctype html>
<html lang="nl">

<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1600px; height: 1200px; overflow: hidden; background: #ffffff; font-family: system-ui, sans-serif; }
  .stage { position: absolute; inset: 0; perspective: 3000px; perspective-origin: 50% 45%; }
  /* Raster van 6 x 5 vensters. Meer vensters in dezelfde ruimte = kleinere
     vensters, dus meer projecten in beeld. */
  .deck {
    position: absolute; left: 50%; top: 50%;
    width: 3000px; height: 1900px;
    margin-left: -1500px; margin-top: -950px;
    display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr);
    gap: 14px;
    transform: rotateX(20deg) rotateY(-14deg) rotateZ(7deg) scale(1.0);
    transform-style: preserve-3d;
  }
  .win {
    position: relative; background: #ffffff; border-radius: 12px; overflow: hidden;
    border: 1px solid #e1e4ea;
    display: flex; flex-direction: column;
  }
  .win:nth-child(3n+2) { transform: translateZ(50px); }
  .win:nth-child(4n+3) { transform: translateZ(28px); }
  .win:nth-child(5n) { transform: translateZ(70px); }
  .bar { height: 26px; background: #f1f2f5; border-bottom: 1px solid #e1e4ea; display: flex; align-items: center; gap: 8px; padding: 0 14px; flex-shrink: 0; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c9cdd6; }
  .dot.accent { background: #2f5bff; }
  .url { margin-left: 10px; height: 14px; flex-grow: 1; border-radius: 7px; background: #e6e8ee; }
  .win img { width: 100%; height: 100%; object-fit: cover; object-position: left top; display: block; flex-grow: 1; min-height: 0; }
</style>
</head>
